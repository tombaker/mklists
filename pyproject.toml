[project]
name = "mklists"
version = "1.0"
description = ""
authors = [{ name = "Tom Baker", email = "tom@tombaker.org" }]
readme = "README.md"
requires-python = ">=3.14,<4.0"
dependencies = [
    "pyyaml>=6.0.3,<7.0.0",
    "click>=8.3.1,<9.0.0",
]

[project.scripts]
mklists = "mklists.cli:cli"

[dependency-groups]
dev = [
    "pytest>=9.0.3,<10.0.0",
    "pytest-mock>=3.15.1,<4.0.0",
    "coverage>=7.5,<8.0",
    "pylint>=4.0.4,<5.0.0",
    "ruff>=0.14.11,<0.15.0",
    "ipython>=9.9.0,<10.0.0",
    "mypy>=1.19.1,<2.0.0",
    "mkdocs>=1.6,<2.0",
    "mkdocs-material>=9.7.7,<10.0.0",
    "types-pyyaml>=6.0.12,<7.0.0",
]

[tool.uv]
# Floors for transitive dependencies flagged by Dependabot
constraint-dependencies = [
    "urllib3>=2.8.0",
    "pymdown-extensions>=11.0.1",
    "pygments>=2.20.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 88

# Match flake8 excludes
exclude = [
  ".git",
  ".idea",
  ".ipynb_checkpoints",
  ".pytest_cache",
  ".venv",
  "docs",
  "explore",
  "htmlcov",
  "notes",
]

[tool.ruff.lint]
# tests/ is formatted by `ruff format` but not linted
exclude = ["tests"]
select = ["E", "F", "W", "I", "PL", "B", "UP"]
# Match flake8 ignores (Black-compatible)
extend-ignore = [
    "E203",  # whitespace before ":"
]

[tool.ruff.lint.per-file-ignores]
# Match flake8 per-file ignores
"tests/**/*.py" = [
    "E501",  # line too long
    "W291",  # trailing whitespace
]

[tool.pylint.messages_control]
disable = [
    "logging-fstring-interpolation",  # f-strings in logger calls are intentional
]

[tool.pylint.design]
max-attributes = 10  # default 7 is too low for data-holding dataclasses

[tool.mypy]
python_version = "3.14"
strict = true
